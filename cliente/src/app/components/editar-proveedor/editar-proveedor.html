<app-navbar></app-navbar>

<div class="container py-5">
  <h1 class="text-center mb-4 fw-bold">Editar Proveedor</h1>

  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">

      <div class="card shadow border-0">
        <div class="card-header bg-primary text-white py-3">
          <span class="fs-5 fw-semibold">Datos del Proveedor</span>
        </div>

        <div class="card-body p-4">

          @if (cargando()) {
            <div class="text-center py-4">
              <p class="text-muted mb-0">Cargando proveedor...</p>
            </div>
          } @else {

            <form (ngSubmit)="guardar()">

              <div class="mb-3">
                <label for="idProveedor" class="form-label">Código</label>
                <input
                  type="text"
                  class="form-control"
                  id="idProveedor"
                  [value]="idProveedor"
                  disabled>
              </div>

              <div class="mb-3">
                <label for="nombreProveedor" class="form-label">Nombre del proveedor</label>
                <input
                  type="text"
                  class="form-control"
                  id="nombreProveedor"
                  name="nombreProveedor"
                  [(ngModel)]="nombreProveedor">
              </div>

              <div class="mb-3">
                <label for="ubicacion" class="form-label">Ubicación</label>
                <input
                  type="text"
                  class="form-control"
                  id="ubicacion"
                  name="ubicacion"
                  [(ngModel)]="ubicacion">
              </div>

              @if (mensajeError()) {
                <div class="alert alert-danger py-2">
                  {{ mensajeError() }}
                </div>
              }

              <div class="d-flex gap-2 justify-content-end mt-4">
                <button type="button" class="btn btn-secondary" (click)="cancelar()">
                  Cancelar
                </button>
                <button type="submit" class="btn btn-primary" [disabled]="guardando()">
                  @if (guardando()) {
                    Guardando...
                  } @else {
                    Guardar Cambios
                  }
                </button>
              </div>

            </form>

          }

        </div>
      </div>

    </div>
  </div>
</div>
