<app-navbar></app-navbar>

<div class="container py-5">
  <h1 class="text-center mb-4 fw-bold">Nuevo Proveedor</h1>

  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">

      <div class="card shadow border-0">
        <div class="card-header bg-primary text-white py-3">
          <span class="fs-5 fw-semibold">Datos del Proveedor</span>
        </div>

        <div class="card-body p-4">

          <form (ngSubmit)="guardar()">

            <div class="mb-3">
              <label for="nombreProveedor" class="form-label">Nombre del proveedor</label>
              <input
                type="text"
                class="form-control"
                id="nombreProveedor"
                name="nombreProveedor"
                [(ngModel)]="nombreProveedor"
                placeholder="Ej. Muebles del Norte S.A.">
            </div>

            <div class="mb-3">
              <label for="ubicacion" class="form-label">Ubicación</label>
              <input
                type="text"
                class="form-control"
                id="ubicacion"
                name="ubicacion"
                [(ngModel)]="ubicacion"
                placeholder="Ej. Zona 4, Ciudad de Guatemala">
            </div>

            @if (mensajeError()) {
              <div class="alert alert-danger py-2">
                {{ mensajeError() }}
              </div>
            }

            <div class="d-flex gap-2 justify-content-end mt-4">
              <button type="button" class="btn btn-secondary" (click)="cancelar()">
                Cancelar
              </button>
              <button type="submit" class="btn btn-primary" [disabled]="guardando()">
                @if (guardando()) {
                  Guardando...
                } @else {
                  Guardar Proveedor
                }
              </button>
            </div>

          </form>

        </div>
      </div>

    </div>
  </div>
</div>
