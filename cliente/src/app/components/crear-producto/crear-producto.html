<app-navbar></app-navbar>

<div class="container py-5">
  <h1 class="text-center mb-4 fw-bold">Nuevo Producto</h1>

  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">

      <div class="card shadow border-0">
        <div class="card-header bg-primary text-white py-3">
          <span class="fs-5 fw-semibold">Datos del Producto</span>
        </div>

        <div class="card-body p-4">

          <form (ngSubmit)="guardar()">

            <div class="mb-3">
              <label for="nombreProducto" class="form-label">Nombre del producto</label>
              <input
                type="text"
                class="form-control"
                id="nombreProducto"
                name="nombreProducto"
                [(ngModel)]="nombreProducto"
                placeholder="Ej. Escritorio Ejecutivo">
            </div>

            <div class="mb-3">
              <label for="categoria" class="form-label">Categoría</label>
              <select
                class="form-select"
                id="categoria"
                name="categoria"
                [(ngModel)]="categoria">
                <option value="">Seleccione una categoría</option>
                @for (cat of categorias; track cat) {
                  <option [value]="cat">{{ cat }}</option>
                }
              </select>
            </div>

            <div class="mb-3">
              <label for="precio" class="form-label">Precio (Q)</label>
              <input
                type="number"
                class="form-control"
                id="precio"
                name="precio"
                step="0.01"
                min="0"
                [(ngModel)]="precio"
                placeholder="0.00">
            </div>

            <div class="alert alert-info py-2">
              El stock inicia en 0. Solo aumenta mediante registros de compra.
            </div>

            @if (mensajeError) {
              <div class="alert alert-danger py-2">
                {{ mensajeError }}
              </div>
            }

            <div class="d-flex gap-2 justify-content-end mt-4">
              <button type="button" class="btn btn-secondary" (click)="cancelar()">
                Cancelar
              </button>
              <button type="submit" class="btn btn-primary" [disabled]="guardado">
                @if (guardado) {
                  Guardando...
                } @else {
                  Guardar Producto
                }
              </button>
            </div>

          </form>

        </div>
      </div>

    </div>
  </div>
</div>
